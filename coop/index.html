<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Maria Ganeva — Software Engineering Co-op portfolio.">
  <title>Maria Ganeva | Software Engineering Co-op</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap");

    :root {
      --navy: #0b1f33;
      --navy-soft: #102b43;
      --teal: #4f7887;
      --teal-light: #d8e7e9;
      --sage: #a6b78f;
      --sage-light: #e6eddc;
      --cream: #f5f2eb;
      --white: #ffffff;
      --text: #183044;
      --text-soft: #607080;
      --border: rgba(11, 31, 51, 0.12);
      --shadow-sm: 0 8px 24px rgba(11, 31, 51, 0.08);
      --shadow-md: 0 18px 50px rgba(11, 31, 51, 0.12);
      --radius-sm: 12px;
      --radius-md: 20px;
      --radius-lg: 30px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: var(--navy);
  font-family: "DM Sans", Arial, sans-serif;
  color: var(--text);
  cursor: default;
}

a, button, .peak-btn, .nav-pill, .icon-link {
  cursor: pointer;
}

    /* BACKGROUND MOUNTAIN IMAGE CONTAINER */
    .hero-container {
      position: relative;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0b253a 0%, #5b8393 50%, #d8e5e7 100%);
      background-image: url('mountain-bg.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* NAVIGATION */
    .home-nav {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 30px 50px;
      z-index: 20;
    }

    .brand {
      color: white;
      font-family: "Space Grotesk", sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      text-decoration: none;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    .nav-pill {
      background: rgba(11, 31, 51, 0.7);
      color: white;
      padding: 10px 20px;
      border-radius: 999px;
      font-weight: 600;
      text-decoration: none;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.2);
      transition: background 0.2s ease;
    }

    .nav-pill:hover {
      background: rgba(11, 31, 51, 0.9);
    }

    /* INTRODUCTION */
    .home-intro {
      position: absolute;
      top: 120px;
      left: 50px;
      z-index: 15;
      max-width: 500px;
      color: white;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    .home-intro .eyebrow {
      font-family: "Space Grotesk", sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .home-intro h1 {
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(2.5rem, 4vw, 3.5rem);
      line-height: 1.1;
      margin-bottom: 15px;
    }

    .home-intro p {
      font-size: 1.05rem;
      color: rgba(255,255,255,0.9);
      line-height: 1.6;
    }

    /* PEAK STYLING */
    .peak {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translate(-50%, -100%);
      z-index: 10;
    }

    .peak-about {
      top: 28%;
      left: 45%;
    }

    .peak-work {
      top: 42%;
      left: 66%;
    }

    .peak-marker {
      width: 10px;
      height: 10px;
      background-color: #0b1f33;
      border: 2px solid white;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(0,0,0,0.5);
      margin-bottom: 8px;
    }

    .peak-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .peak-btn {
      background-color: #0b1f33;
      color: #ffffff;
      padding: 10px 22px;
      border-radius: 999px;
      text-decoration: none;
      font-family: "Space Grotesk", sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      border: 2px solid rgba(255,255,255,0.3);
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .peak-btn:hover {
      background-color: #163d52;
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    .peak-icons {
      display: flex;
      gap: 8px;
      background-color: rgba(11, 31, 51, 0.85);
      padding: 6px 12px;
      border-radius: 16px;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .icon-link {
      color: #d8e7e9;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, color 0.2s ease;
      text-decoration: none;
    }

    .icon-link:hover {
      transform: scale(1.15);
      color: #ffffff;
    }

    @media (max-width: 768px) {
      .home-nav {
        padding: 20px;
      }
      .home-intro {
        top: 90px;
        left: 20px;
        right: 20px;
        max-width: none;
      }
      .peak-about {
        top: 32%;
        left: 40%;
      }
      .peak-work {
        top: 48%;
        left: 70%;
      }
    }
  </style>
</head>
<body>

  <div class="hero-container">

    <!-- Navigation -->
    <header class="site-nav home-nav">
      <a class="brand" href="index.html">Maria Ganeva</a>
      <a class="nav-link nav-pill" href="about.html" aria-label="Open About Me page">About Me</a>
    </header>

    <!-- Introduction -->
    <section class="home-intro" aria-label="Introduction">
      <div class="eyebrow" style="color: #dce9c9;">
        Software Engineering · Cybersecurity · Data
      </div>
      <h1>
        Build. Explore.<br>
        Keep climbing.

      <p>
        A portfolio of software, data, design, and web projects by Maria Ganeva.

    <div class="peak peak-about">

              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>

        </div>
      </div>
    </div>

    <!-- MY WORK mountain point -->
    <div class="peak peak-work">
      <span class="peak-marker" aria-hidden="true"></span>
      <div class="peak-content">
        <a class="peak-btn" href="projects.html">My Work</a>
        <div class="peak-icons" aria-label="Work links">
          <a class="icon-link" href="https://github.com/Maria-Ganeva" target="_blank" rel="noopener noreferrer" aria-label="GitHub" title="GitHub">

          <a class="icon-link" href="projects.html" aria-label="Projects" title="Projects">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>

        </div>
      </div>
    </div>

  </div>

</body>
</html>
